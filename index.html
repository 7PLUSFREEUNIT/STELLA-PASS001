<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella Pass - Premium Member Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
         :root {
            --space-bg: #050714;
            --nebula-purple: #7b61ff;
            --star-gold: #ffd700;
            --neon-cyan: #00ffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #b0b0d1;
            --liquid-blur: blur(25px);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 15% 15%, rgba(123, 97, 255, 0.18) 0%, transparent 45%), radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.12) 0%, transparent 45%), var(--space-bg);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .twinkling-star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: pulseStar var(--d) ease-in-out infinite alternate;
        }
        
        @keyframes pulseStar {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
                box-shadow: 0 0 8px var(--neon-cyan);
            }
        }
        
        .branding-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .branding-logo {
            width: 100px;
            height: auto;
            object-fit: contain;
        }
        
        #auth-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .auth-card {
            background: rgba(11, 14, 35, 0.65);
            backdrop-filter: var(--liquid-blur);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 45px 40px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .input-group input,
        .input-group select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px 18px;
            color: white;
            outline: none;
            font-size: 15px;
        }
        
        .input-group select option {
            background: var(--space-bg);
            color: white;
        }
        
        .btn-main {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--star-gold), #ff9900);
            color: #050714;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-main:hover {
            transform: translateY(-3px);
        }
        /* ====================================================================
            💎 CUSTOM PREMIUM NOTIFICATION MODAL DESIGN
            ==================================================================== */
        
        .stella-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 5, 15, 0.4);
            backdrop-filter: blur(12px);
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInAura 0.3s ease-out;
        }
        
        .stella-alert-box {
            background: rgba(11, 14, 35, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 24px;
            padding: 30px;
            width: 400px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 240, 255, 0.1);
            animation: scaleUpAura 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .stella-alert-box i {
            font-size: 45px;
            margin-bottom: 15px;
            display: block;
        }
        
        .stella-alert-box .success-icon {
            color: #00ff00;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
        
        .stella-alert-box .failed-icon {
            color: #ff4a4a;
            text-shadow: 0 0 15px rgba(255, 74, 74, 0.4);
        }
        
        .stella-alert-box p {
            font-size: 15px;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 22px;
            font-weight: 500;
        }
        
        .stella-alert-btn {
            background: linear-gradient(135deg, #ffd700, #ff9900);
            color: #050714;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        
        @keyframes fadeInAura {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        @keyframes scaleUpAura {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        /* APPLICATION ENGINE CONTAINER Layout */
        
        #app-section {
            display: none;
            padding-bottom: 140px;
        }
        
        header {
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(11, 14, 35, 0.6);
            backdrop-filter: var(--liquid-blur);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .lvl-badge {
            background: var(--star-gold);
            color: #050714;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
        }
        
        .exp-container {
            width: 100%;
            max-width: 300px;
            margin-top: 8px;
        }
        
        .exp-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .exp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--nebula-purple), var(--neon-cyan));
            width: 0%;
            transition: width 0.4s ease;
        }
        
        .exp-text {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
            display: block;
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .mission-hub-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .mission-hub-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .inventory-card {
            background: rgba(123, 97, 255, 0.06);
            border: 1px dashed var(--nebula-purple);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .inventory-title {
            font-size: 14px;
            color: var(--neon-cyan);
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        
        .inventory-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .inv-badge-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        
        .controls-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: center;
        }
        
        .roadmap-track {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        
        @media (max-width: 600px) {
            .roadmap-track {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        
        .node {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 25px 20px;
            text-align: center;
        }
        
        .node.locked {
            opacity: 0.4;
            filter: grayscale(0.9);
        }
        
        .node.claimable {
            border-color: var(--neon-cyan);
            background: rgba(0, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        
        .node.claimed {
            border-color: rgba(255, 255, 255, 0.1);
            opacity: 0.6;
        }
        
        .node-num {
            font-family: 'Fredoka';
            font-size: 32px;
            color: var(--star-gold);
            margin-bottom: 5px;
        }
        
        .node-reward {
            font-size: 13px;
            color: var(--text-dim);
            min-height: 38px;
            margin-bottom: 15px;
        }
        
        .btn-claim {
            background: var(--glass-border);
            color: var(--text-dim);
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
        }
        
        .node.claimable .btn-claim {
            background: var(--neon-cyan);
            color: #050714;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .shop-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
        }
        
        .shop-card i {
            font-size: 44px;
            color: var(--star-gold);
            margin-bottom: 15px;
        }
        
        .shop-card-cost {
            color: var(--neon-cyan);
            font-size: 16px;
            font-weight: 700;
            margin: 10px 0 15px 0;
        }
        
        .btn-exchange {
            width: 100%;
            background: var(--nebula-purple);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-exchange:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 14, 35, 0.95);
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            border-top: 1px solid var(--glass-border);
            z-index: 1000;
        }
        
        .nav-item {
            text-align: center;
            color: var(--text-dim);
            font-size: 12px;
            cursor: pointer;
        }
        
        .nav-item i {
            font-size: 22px;
            display: block;
            margin-bottom: 5px;
        }
        
        .nav-item.active {
            color: var(--neon-cyan);
        }
        
        .copyright-banner {
            width: 100%;
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            font-size: 13px;
            color: var(--text-dim);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 20, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
        
        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-dim);
            cursor: pointer;
        }
        
        .toggle-auth span {
            color: var(--neon-cyan);
            font-weight: 600;
        }
    </style>
</head>

    <section id="auth-section">

            name: "200,000 MMK (သို့) UNIT",
            cost: 3000,
            icon: "fa-solid fa-money-bill-wave"
        }];

        // Background Star Field Generator
        function createStarFieldSystem() {
            const container = document.getElementById('stars-container');
            const totalStarsCount = 45;
            for (let i = 0; i < totalStarsCount; i++) {
                const star = document.createElement('div');
                star.className = 'twinkling-star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--d', (Math.random() * 4 + 2) + 's');
                container.appendChild(star);
            }
        }
        createStarFieldSystem();

        // --- 📌 CUSTOM PREMIUM ALERT BOX INJECTOR ---
        function stellaAlert(message) {
            const isSuccess = message.includes("🎉") || message.includes("အောင်မြင်");
            const iconClass = isSuccess ? "fa-solid fa-circle-check success-icon" : "fa-solid fa-circle-exclamation failed-icon";
            const overlay = document.createElement("div");
            overlay.className = "stella-alert-overlay";
            overlay.innerHTML = `
                <div class="stella-alert-box">
                    <i class="${iconClass}"></i><p>${message}</p>
                    <button class="stella-alert-btn" onclick="this.closest('.stella-alert-overlay').remove()">OK</button>
                </div>`;
            document.body.appendChild(overlay);
        }

        function toggleAuth(mode) {
            document.getElementById('login-card').style.display = (mode === 'login') ? 'block' : 'none';
            document.getElementById('register-card').style.display = (mode === 'register') ? 'block' : 'none';
        }

        // --- LOGIN EXECUTIVE PIPELINE ---
        async function executeClientLogin(e) {
            e.preventDefault();
            const user = document.getElementById("login-user").value.trim();
            const pass = document.getElementById("login-pass").value.trim();

            const loginBtn = document.getElementById("login-submit-btn");
            const btnSpinner = document.getElementById("login-btn-spinner");
            const btnText = document.getElementById("btn-text-label");

            loginBtn.disabled = true;
            btnText.innerText = "AUTHENTICATING...";
            btnSpinner.style.display = "inline-block";

            try {
                const res = await fetch(WEB_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "player_login",
                        player_id: user,
                        password: pass
                    })
                });
                const result = await res.json();

                if (result.status === "success") {
                    playerData = result.data;
                    renderPortalDashboard();
                } else {
                    stellaAlert("❌ " + result.message);
                }
            } catch (err) {
                stellaAlert("❌ စနစ်ချက်ဆက်မှု ပြတ်တောက်သွားပါသည်။ Link ကိုပြန်စစ်ပါ။");
            } finally {
                loginBtn.disabled = false;
                btnText.innerText = "LOG IN PORTAL";
                btnSpinner.style.display = "none";
            }
        }

        async function executeClientRegistration(e) {
            e.preventDefault();
            const key = document.getElementById('reg-key').value.trim();
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const tier = document.getElementById('reg-tier').value;
            if (key !== SECURITY_KEY) {
                stellaAlert("❌ Security Key မှားယွင်းနေပါသည်။");
                return;
            }
            document.getElementById('loader').style.display = 'flex';
            try {
                const res = await fetch(WEB_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "player_register",
                        player_id: user,
                        password: pass,
                        pass_type: tier
                    })
                });
                const result = await res.json();
                stellaAlert(result.message);
                if (result.status === "success") toggleAuth('login');
            } catch (err) {
                stellaAlert("Successful!");
            }
            document.getElementById('loader').style.display = 'none';
        }

        function renderPortalDashboard() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('display-user').innerText = playerData.player_id;
            updateExpProgressBarUI();
            generateRoadmapNodes();
            generateGiftShopItems(); // Gift Shop ပစ္စည်းများ ထည့်သွင်းခြင်း
        }

        function updateExpProgressBarUI() {
            const currentLevel = parseInt(playerData.current_level || 1);
            const totalExp = parseInt(playerData.total_exp || 0);
            const baseExpForCurrentLvl = (currentLevel - 1) * 100;
            const currentLvlProgressExp = totalExp - baseExpForCurrentLvl;
            let percentage = currentLvlProgressExp;
            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            document.getElementById('exp-progress').style.width = percentage + "%";
            document.getElementById('exp-text-display').innerText = `${percentage} / 100 EXP`;
            document.getElementById('display-level').innerText = `LEVEL ${currentLevel}`;
            document.getElementById('display-cards').innerText = playerData.available_cards;
            document.getElementById('inv-cards-count').innerText = playerData.available_cards;

            document.getElementById('inv-spins-count').innerText = playerData.available_spins || 0;
            document.getElementById('inv-bonus-count').innerText = playerData.available_bonus || 0;
        }

        function generateRoadmapNodes() {
            const container = document.getElementById('nodes-container');
            container.innerHTML = "";
            const activeRewardMatrix = playerData.pass_type === "Gold Star" ? goldRewards : liteRewards;
            const currentLevel = parseInt(playerData.current_level || 1);
            const historyString = playerData.claimed_history || "";
            const claimedArray = historyString.split(",");

            for (let i = 1; i <= 30; i++) {
                const node = document.createElement('div');
                const neededExpToUnlockThisNode = (i - 1) * 100;
                let nodeStatus = "locked";

                if (claimedArray.includes(i.toString())) nodeStatus = "claimed";
                else if (playerData.total_exp >= neededExpToUnlockThisNode && i <= currentLevel) nodeStatus = "claimable";

                node.className = `node ${nodeStatus}`;
                node.innerHTML = `
                    <div class="node-num">${i}</div><div class="node-reward">${activeRewardMatrix[i-1]}</div>
                    <button class="btn-claim" ${nodeStatus !== 'claimable' ? 'disabled' : ''} onclick="executeRewardClaim(${i})">
                        ${nodeStatus === 'claimed' ? '✓ CLAIMED' : (nodeStatus === 'claimable' ? 'CLAIM NOW' : 'LOCKED')}
                    </button>`;
                container.appendChild(node);
            }
        }

        // --- 🎁 GIFT SHOP GENERATION PIPELINE ---
        function generateGiftShopItems() {
            const shopContainer = document.getElementById('gifts-shop-grid-injection');
            shopContainer.innerHTML = "";

            shopGiftsData.forEach(gift => {
                const card = document.createElement('div');
                card.className = "shop-card";
                card.innerHTML = `
                    <i class="${gift.icon}"></i>
                    <h3 style="font-size:15px; min-height:40px; margin-bottom:5px;">${gift.name}</h3>
                    <div class="shop-card-cost"><i class="fa-solid fa-clone"></i> ${gift.cost} Cards</div>
                    <button class="btn-exchange" onclick="executeGiftExchange(${gift.id})">EXCHANGE</button>
                `;
                shopContainer.appendChild(card);
            });
        }

        // --- 🔄 EXECUTIVE EXCHANGE FUNCTION PIPELINE ---
        async function executeGiftExchange(giftId) {
            const selectedGift = shopGiftsData.find(g => g.id === giftId);
            if (!selectedGift) return;

            const currentCards = parseInt(playerData.available_cards || 0);

            // ⚠️ [Validation Check] ကတ်အရေအတွက် လုံလောက်မှု ရှိ/မရှိ စစ်ဆေးခြင်း
            if (currentCards < selectedGift.cost) {
                stellaAlert(`❌ ကတ်အရေအတွက် မလုံလောက်ပါ။ ဤပစ္စည်းလဲလှယ်ရန် Stella Cards (${selectedGift.cost}) ခု လိုအပ်ပါသည်။`);
                return;
            }

            document.getElementById('loader').style.display = 'flex';
            const remainsCardsTotal = currentCards - selectedGift.cost;

            try {
                const res = await fetch(WEB_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "player_exchange",
                        player_id: playerData.player_id,
                        gift_id: selectedGift.id,
                        gift_name: selectedGift.name,
                        cost: selectedGift.cost,
                        new_cards: remainsCardsTotal
                    })
                });
                const result = await res.json();

                if (result.status === "success") {
                    playerData = result.data; // Sync fresh data frame
                    renderPortalDashboard();
                    stellaAlert(`🎉 ${selectedGift.name} အား အောင်မြင်စွာ လဲလှယ်ပြီးပါပြီ။`);
                } else {
                    stellaAlert("❌ " + result.message);
                }
            } catch (e) {
                stellaAlert("Exchange Sync Error!");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        async function executeRewardClaim(nodeIndexID) {
            document.getElementById('loader').style.display = 'flex';
            const activeRewardMatrix = playerData.pass_type === "Gold Star" ? goldRewards : liteRewards;
            const rewardStr = activeRewardMatrix[nodeIndexID - 1];
            let cardReward = 0;
            let spinReward = 0;
            let bonusReward = 0;
            if (rewardStr.includes("Card")) cardReward = parseInt(rewardStr.replace(/[^0-9]/g, ''));
            else if (rewardStr.includes("Free Spin")) spinReward = 1;
            else if (rewardStr.includes("Stella")) bonusReward = 1;

            const newCardsTotal = parseInt(playerData.available_cards || 0) + cardReward;
            const newSpinsTotal = parseInt(playerData.available_spins || 0) + spinReward;
            const newBonusTotal = parseInt(playerData.available_bonus || 0) + bonusReward;

            try {
                const res = await fetch(WEB_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "player_claim",
                        player_id: playerData.player_id,
                        node_index: nodeIndexID,
                        new_cards: newCardsTotal,
                        new_spins: newSpinsTotal,
                        new_bonus: newBonusTotal
                    })
                });
                const result = await res.json();
                if (result.status === "success") {
                    playerData = result.data;
                    renderPortalDashboard();
                    stellaAlert(`🎉 ${rewardStr} အား ရယူပြီးပါပြီ။`);
                } else {
                    stellaAlert("❌ " + result.message);
                }
            } catch (e) {
                stellaAlert("Sync Error!");
            }
            document.getElementById('loader').style.display = 'none';
        }

        async function triggerDailyLoginClaim() {
            stellaAlert("Daily login function executed");
        }

        function redirectToTelegramAdmin() {
            window.open("https://t.me/stella_admin", "_blank");
        }

        function switchActivePortalTab(targetTabName) {
            document.getElementById('tab-roadmap').style.display = (targetTabName === 'roadmap') ? 'block' : 'none';
            document.getElementById('tab-shop').style.display = (targetTabName === 'shop') ? 'block' : 'none';

            document.getElementById('nav-btn-roadmap').className = `nav-item ${(targetTabName === 'roadmap') ? 'active' : ''}`;
            document.getElementById('nav-btn-shop').className = `nav-item ${(targetTabName === 'shop') ? 'active' : ''}`;
        }

        function logout() {
            playerData = null;
            document.getElementById('app-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'flex';
            document.getElementById('login-user').value = "";
            document.getElementById('login-pass').value = "";
        }
    </script>
</body>

</html>
